<rect x="80" y="685" width="10" height="330" rx="4" fill="#087F80" stroke="#087F80" stroke-width="3"/>
<text x="110" y="730.2" font-family="Arial" font-size="29" font-weight="700" fill="#087F80">READ + WRITE AUTHORITY</text>
<text x="110" y="787.8" font-family="Arial" font-size="46" font-weight="700" fill="#193749">Hub</text>
<text x="110" y="848.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Read + write Library access.</text>
<text x="110" y="901.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Publish additions and corrections.</text>
<text x="110" y="955.2" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Coordinate tasks and reviews.</text>
<rect x="855" y="685" width="690" height="330" rx="16" fill="#EDF5F8" stroke="#8BA3B1" stroke-width="3"/>
<rect x="855" y="685" width="10" height="330" rx="4" fill="#3075A3" stroke="#3075A3" stroke-width="3"/>
<text x="885" y="730.2" font-family="Arial" font-size="29" font-weight="700" fill="#3075A3">RESEARCH + HUMAN REVIEW</text>
<text x="885" y="787.8" font-family="Arial" font-size="46" font-weight="700" fill="#193749">Spokes</text>
<text x="885" y="848.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Perform assigned work.</text>
<text x="885" y="901.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Human approves submission;</text>
<text x="885" y="955.2" font-family="Arial" font-size="40" font-weight="400" fill="#193749">route it to the Hub.</text>
<rect x="1630" y="685" width="690" height="330" rx="16" fill="#EDF5F8" stroke="#8BA3B1" stroke-width="3"/>
<rect x="1630" y="685" width="10" height="330" rx="4" fill="#3075A3" stroke="#3075A3" stroke-width="3"/>
<text x="1660" y="730.2" font-family="Arial" font-size="29" font-weight="700" fill="#3075A3">VALIDATE + REPORT</text>
<text x="1660" y="787.8" font-family="Arial" font-size="46" font-weight="700" fill="#193749">Ingestor</text>
<text x="1660" y="848.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Receive Hub-accepted work.</text>
<text x="1660" y="901.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Validate / reproduce as needed;</text>
<text x="1660" y="955.2" font-family="Arial" font-size="40" font-weight="400" fill="#193749">return results to the Hub.</text>
