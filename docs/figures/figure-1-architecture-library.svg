<text x="1050" y="1157.6" font-family="Arial" font-size="32" font-weight="400" fill="#3075A3">Spokes + Ingestor: read only</text>
<rect x="70" y="1555" width="2260" height="80" rx="10" fill="#EDF5F8" stroke="#EDF5F8" stroke-width="3"/>
<text x="95" y="1602.2" font-family="Arial" font-size="34" font-weight="400" fill="#486274">Spokes and Ingestor send contributions to the Hub. They do not write to the Library.</text></svg>