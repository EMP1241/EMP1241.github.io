<text x="110" y="1225.2" font-family="Arial" font-size="29" font-weight="700" fill="#087F80">HUB-PUBLISHED / APPROVED PROJECT EVIDENCE</text>
<text x="110" y="1282.8" font-family="Arial" font-size="46" font-weight="700" fill="#193749">Shared Library</text>
<text x="110" y="1343.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Findings + methods + source provenance + artifacts + dependencies + review limits.</text>
<text x="110" y="1396.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Hub reads, publishes and corrects; Spokes and Ingestor read approved versions.</text>
