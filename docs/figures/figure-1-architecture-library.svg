<text x="80" y="70.6" font-family="Arial" font-size="32" font-weight="700" fill="#8FD7CE">01  /  RESEARCH ARCHITECT</text>
<text x="80" y="144.6" font-family="Arial" font-size="62" font-weight="700" fill="#FFFFFF">A research team with a shared evidence base</text>
<text x="80" y="205.8" font-family="Arial" font-size="36" font-weight="400" fill="#D9E7ED">Factory configuration above; project roles and controlled Library access below.</text>
<rect x="80" y="295" width="1060" height="270" rx="16" fill="#EDF5F8" stroke="#8BA3B1" stroke-width="3"/>
<rect x="80" y="295" width="10" height="270" rx="4" fill="#3075A3" stroke="#3075A3" stroke-width="3"/>
<text x="110" y="340.2" font-family="Arial" font-size="29" font-weight="700" fill="#3075A3">METHODS + HUMAN PROJECT DESIGN</text>
<text x="110" y="397.8" font-family="Arial" font-size="46" font-weight="700" fill="#193749">Research Architect factory</text>
<text x="110" y="458.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Select applicable guidance, record decisions,</text>
<text x="110" y="511.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">complete intake and approve exact configuration.</text>
<rect x="1260" y="295" width="1060" height="270" rx="16" fill="#EDF5F8" stroke="#8BA3B1" stroke-width="3"/>
<rect x="1260" y="295" width="10" height="270" rx="4" fill="#3075A3" stroke="#3075A3" stroke-width="3"/>
<text x="1290" y="340.2" font-family="Arial" font-size="29" font-weight="700" fill="#3075A3">SOURCE COLLECTION</text>
<text x="1290" y="397.8" font-family="Arial" font-size="46" font-weight="700" fill="#193749">Scientific-methods knowledge base</text>
<text x="1290" y="458.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Published sources, focused appraisals and limits.</text>
<text x="1290" y="511.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Distinct from the project Library.</text>
