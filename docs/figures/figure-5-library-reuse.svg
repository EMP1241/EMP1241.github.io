<text x="1850" y="895.2" font-family="Arial" font-size="29" font-weight="700" fill="#3075A3">05  /  INGESTOR</text>
<text x="1850" y="948.0" font-family="Arial" font-size="40" font-weight="700" fill="#193749">Validate results</text>
<text x="1850" y="1013.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Reproduce if needed</text>
<text x="1850" y="1066.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Record checks / limits</text>
<text x="1850" y="1120.2" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Return findings to Hub</text>
<rect x="1240" y="850" width="500" height="330" rx="16" fill="#FFF3DD" stroke="#8BA3B1" stroke-width="3"/>
<rect x="1240" y="850" width="10" height="330" rx="4" fill="#A46414" stroke="#A46414" stroke-width="3"/>
<text x="1270" y="895.2" font-family="Arial" font-size="29" font-weight="700" fill="#A46414">06  /  HUB + HUMAN</text>
<text x="1270" y="948.0" font-family="Arial" font-size="40" font-weight="700" fill="#193749">Final approval</text>
<text x="1270" y="1013.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Review validation</text>
<text x="1270" y="1066.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Approve exact version</text>
<text x="1270" y="1120.2" font-family="Arial" font-size="40" font-weight="400" fill="#193749">and permitted use</text>
<rect x="660" y="850" width="500" height="330" rx="16" fill="#E8F4F0" stroke="#8BA3B1" stroke-width="3"/>
<rect x="660" y="850" width="10" height="330" rx="4" fill="#087F80" stroke="#087F80" stroke-width="3"/>
<text x="690" y="895.2" font-family="Arial" font-size="29" font-weight="700" fill="#087F80">07  /  HUB ONLY</text>
<text x="690" y="948.0" font-family="Arial" font-size="40" font-weight="700" fill="#193749">Publish / correct</text>
<text x="690" y="1013.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Read/write authority</text>
<text x="690" y="1066.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Methods + artifacts</text>
<text x="690" y="1120.2" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Provenance + limits</text>
<rect x="80" y="850" width="500" height="330" rx="16" fill="#E8F4F0" stroke="#8BA3B1" stroke-width="3"/>
<rect x="80" y="850" width="10" height="330" rx="4" fill="#087F80" stroke="#087F80" stroke-width="3"/>
<text x="110" y="895.2" font-family="Arial" font-size="29" font-weight="700" fill="#087F80">08  /  SPOKES + INGESTOR</text>
<text x="110" y="948.0" font-family="Arial" font-size="40" font-weight="700" fill="#193749">Read + reuse</text>
<text x="110" y="1013.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Approved versions</text>
<text x="110" y="1066.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Keep provenance</text>
<text x="110" y="1120.2" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Read-only access</text>
