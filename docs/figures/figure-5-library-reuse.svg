<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1680" viewBox="0 0 2400 1680">
<rect x="0" y="0" width="2400" height="1680" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/>
<rect x="0" y="0" width="2400" height="240" rx="0" fill="#142C3C" stroke="#142C3C" stroke-width="3"/>
<text x="80" y="70.6" font-family="Arial" font-size="32" font-weight="700" fill="#8FD7CE">05  /  RESEARCH ARCHITECT</text>
<text x="80" y="144.6" font-family="Arial" font-size="62" font-weight="700" fill="#FFFFFF">The evidence route: task to approved Library finding</text>
<text x="80" y="205.8" font-family="Arial" font-size="36" font-weight="400" fill="#D9E7ED">Numbers show review order. A transport receipt never substitutes for a review decision.</text>
<rect x="80" y="330" width="500" height="330" rx="16" fill="#EDF5F8" stroke="#8BA3B1" stroke-width="3"/>
<rect x="80" y="330" width="10" height="330" rx="4" fill="#3075A3" stroke="#3075A3" stroke-width="3"/>
<text x="110" y="375.2" font-family="Arial" font-size="29" font-weight="700" fill="#3075A3">01  /  HUB</text>
<text x="110" y="428.0" font-family="Arial" font-size="40" font-weight="700" fill="#193749">Bounded task</text>
<text x="110" y="493.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Question + scope</text>
<text x="110" y="546.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Inputs + methods</text>
<text x="110" y="600.2" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Expected artifacts</text>
<rect x="660" y="330" width="500" height="330" rx="16" fill="#EDF5F8" stroke="#8BA3B1" stroke-width="3"/>
<rect x="660" y="330" width="10" height="330" rx="4" fill="#3075A3" stroke="#3075A3" stroke-width="3"/>
<text x="690" y="375.2" font-family="Arial" font-size="29" font-weight="700" fill="#3075A3">02  /  SPOKE</text>
<text x="690" y="428.0" font-family="Arial" font-size="40" font-weight="700" fill="#193749">Perform work</text>
<text x="690" y="493.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Research with agent</text>
<text x="690" y="546.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Keep methods, data</text>
<text x="690" y="600.2" font-family="Arial" font-size="40" font-weight="400" fill="#193749">and decision trail</text>
<rect x="1240" y="330" width="500" height="330" rx="16" fill="#FFF3DD" stroke="#8BA3B1" stroke-width="3"/>
<rect x="1240" y="330" width="10" height="330" rx="4" fill="#A46414" stroke="#A46414" stroke-width="3"/>
<text x="1270" y="375.2" font-family="Arial" font-size="29" font-weight="700" fill="#A46414">03  /  SOURCE HUMAN</text>
<text x="1270" y="428.0" font-family="Arial" font-size="40" font-weight="700" fill="#193749">Approve submission</text>
<text x="1270" y="493.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Review exact output</text>
<text x="1270" y="546.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Accept contribution</text>
<text x="1270" y="600.2" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Record actual approval</text>
<rect x="1820" y="330" width="500" height="330" rx="16" fill="#EDF5F8" stroke="#8BA3B1" stroke-width="3"/>
<rect x="1820" y="330" width="10" height="330" rx="4" fill="#3075A3" stroke="#3075A3" stroke-width="3"/>
<text x="1850" y="375.2" font-family="Arial" font-size="29" font-weight="700" fill="#3075A3">04  /  HUB</text>
<text x="1850" y="428.0" font-family="Arial" font-size="40" font-weight="700" fill="#193749">Review + accept</text>
<text x="1850" y="493.0" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Inspect evidence</text>
<text x="1850" y="546.6" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Accept for validation</text>
<text x="1850" y="600.2" font-family="Arial" font-size="40" font-weight="400" fill="#193749">Send to Ingestor</text>
