<text x="110" y="1331.4" font-family="Arial" font-size="33" font-weight="700" fill="#486274">DECISION EVIDENCE FOR HUB REVIEW</text>
<text x="110" y="1391.2" font-family="Arial" font-size="39" font-weight="400" fill="#193749">Supply relevant human-agent transcripts, session coverage and omissions with the submission.</text>
<text x="110" y="1446.2" font-family="Arial" font-size="39" font-weight="400" fill="#193749">Retain them in restricted review storage; Library publication does not automatically disclose transcripts.</text>
<rect x="70" y="1555" width="2260" height="80" rx="10" fill="#EDF5F8" stroke="#EDF5F8" stroke-width="3"/>
<text x="95" y="1602.2" font-family="Arial" font-size="34" font-weight="400" fill="#486274">Correction proposals return to the Hub; only the Hub publishes reviewed corrections.</text></svg>