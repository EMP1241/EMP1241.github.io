<text x="34" y="220" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#087F78">2</text>
<text x="34" y="241" font-family="Arial, Helvetica, sans-serif" font-size="10.7" font-weight="700" fill="#142C3C">Contributor work</text>
<text x="156" y="215" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">The briefing credits seven people for data collection. Project</text>
<text x="156" y="228" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">submissions retain original material, attribution and supporting</text>
<text x="156" y="241" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">records.</text>
