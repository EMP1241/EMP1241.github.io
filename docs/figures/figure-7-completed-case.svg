<text x="34" y="410" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#087F78">4</text>
<text x="34" y="431" font-family="Arial, Helvetica, sans-serif" font-size="10.7" font-weight="700" fill="#142C3C">Reviewed context</text>
<text x="156" y="405" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">Reviewed Library entries retain originals, corrections, source links</text>
<text x="156" y="418" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">and limits on use. The briefing identifies accepted project inputs and</text>
<text x="156" y="431" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">retained calculation records.</text>
