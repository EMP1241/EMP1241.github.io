<path d="M248,284 L252,288" fill="none" stroke="#087F78" stroke-width="1.1"/>
<path d="M256,284 L252,288" fill="none" stroke="#087F78" stroke-width="1.1"/>
<rect x="22" y="289" width="460" height="82" fill="#EFF5F5"/>
<text x="34" y="315" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#087F78">3</text>
<text x="34" y="336" font-family="Arial, Helvetica, sans-serif" font-size="10.7" font-weight="700" fill="#142C3C">Review and</text>
<text x="34" y="349" font-family="Arial, Helvetica, sans-serif" font-size="10.7" font-weight="700" fill="#142C3C">decision</text>
<text x="156" y="310" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">The Hub checks submitted claims against their sources, records</text>
<text x="156" y="323" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">corrections and obtains the project lead&#x27;s approval before sharing</text>
<text x="156" y="336" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">reviewed work.</text>
