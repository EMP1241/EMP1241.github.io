<text x="22" y="24" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" fill="#A5E4DC">RESEARCH ARCHITECT / COMPLETED NWSW CASE</text>
<text x="22" y="51" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">A traceable route to a finished briefing</text>
<text x="22" y="70" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#FFFFFF">People, retained evidence, review and reusable project knowledge</text>
<rect x="22" y="99" width="460" height="82" fill="#EFF5F5"/>
<text x="34" y="125" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#087F78">1</text>
<text x="34" y="146" font-family="Arial, Helvetica, sans-serif" font-size="10.7" font-weight="700" fill="#142C3C">Sources</text>
<text x="156" y="120" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">Agency tables and scholarly sources retain their identity, edition,</text>
<text x="156" y="133" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">dates and units. Mexican case reports and U.S. animal confirmations</text>
<text x="156" y="146" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">remain distinct.</text>
