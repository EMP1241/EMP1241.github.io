<text x="34" y="505" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#087F78">5</text>
<text x="34" y="526" font-family="Arial, Helvetica, sans-serif" font-size="10.7" font-weight="700" fill="#142C3C">Finished synthesis</text>
<text x="156" y="500" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">Brandon integrates the evidence with methods, uncertainty and the</text>
<text x="156" y="513" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">results of each research component. Retained inputs and code</text>
<text x="156" y="526" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="400" fill="#203747">support checking and reproduction.</text>
<text x="22" y="590" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#142C3C">136-page briefing  |  2-page summary  |  101-page source companion</text>
<text x="22" y="612" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="400" fill="#485C66">The diagram follows selected project records. Each finding retains its own sources, review scope and limits on</text>
<text x="22" y="625" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="400" fill="#485C66">use.</text>
