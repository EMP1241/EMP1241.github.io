<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title"><title id="title">Design the interface. Define how to test it.</title><defs><linearGradient id="bg"><stop stop-color="#101c29"/><stop offset="1" stop-color="#08121b"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#83bdde"/></marker></defs><rect width="1280" height="800" fill="url(#bg)"/>
<text x="60" y="68" fill="#83bdde" font-family="Segoe UI,Arial,sans-serif" font-size="18">NASA SUITS / STUDENT CHALLENGE PROPOSAL</text>
<text x="60" y="130" fill="#dce6ef" font-family="Segoe UI,Arial,sans-serif" font-size="42">Design the interface. Define how to test it.</text>
<text x="60" y="180" fill="#a4bac9" font-family="Segoe UI,Arial,sans-serif" font-size="24">Evaluation tasks documented in the original proposal; these are planned checks.</text>
