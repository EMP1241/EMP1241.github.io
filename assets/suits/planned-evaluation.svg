<text x="686" y="562" fill="#b5c8d5" font-family="Segoe UI,Arial,sans-serif" font-size="22">Observe errors and interaction friction</text>
<text x="60" y="752" fill="#a4bac9" font-family="Segoe UI,Arial,sans-serif" font-size="20">Proposal-stage evaluation design / No completed trial results are claimed.</text>
