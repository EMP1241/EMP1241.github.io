<text x="686" y="352" fill="#b5c8d5" font-family="Segoe UI,Arial,sans-serif" font-size="22">Assess completion time and user feedback</text>
<rect x="60" y="445" width="560" height="170" rx="18" fill="#142735" stroke="#405b6d"/>
<text x="86" y="487" fill="#dce6ef" font-family="Segoe UI,Arial,sans-serif" font-size="27">Terrain recognition</text>
<text x="86" y="531" fill="#b5c8d5" font-family="Segoe UI,Arial,sans-serif" font-size="22">Identify shapes and surface obstacles</text>
<text x="86" y="562" fill="#b5c8d5" font-family="Segoe UI,Arial,sans-serif" font-size="22">Evaluate the proposed depth display</text>
<rect x="660" y="445" width="560" height="170" rx="18" fill="#142735" stroke="#405b6d"/>
<text x="686" y="487" fill="#dce6ef" font-family="Segoe UI,Arial,sans-serif" font-size="27">Voice interaction</text>
