<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Proposed lunar positioning and command-hub system</title>
<desc id="desc">Wearable tags and fixed spikes supply position updates to a central command hub. The hub maintains a shared map and distributes current positions and pins to connected headsets. New pins and changes return to the hub. Nearby depth sensing supplies terrain cues to each headset.</desc>
<defs>
<linearGradient id="bg"><stop stop-color="#101c29"/><stop offset="1" stop-color="#08121b"/></linearGradient>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#83bdde" stroke-width="1.5"/></marker>
<marker id="return-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#e5bd7a" stroke-width="1.5"/></marker>
</defs>
<rect width="1280" height="800" fill="url(#bg)"/>
