</g>
<g fill="#dce6ef" font-size="26" font-weight="600">
<text x="84" y="278">Local positioning</text>
<text x="504" y="278">Command hub</text>
<text x="924" y="278">Connected headsets</text>
<text x="84" y="535">One shared coordinate reference</text>
<text x="924" y="535">Nearby terrain</text>
</g>
<g fill="#b5c8d5" font-size="21">
<text x="84" y="322">Wearable tags + fixed spikes</text>
<text x="84" y="354">RSSI + trilateration proposal</text>
<text x="504" y="322">Maintain latest crew positions</text>
<text x="504" y="354">Store shared waypoints + pins</text>
<text x="924" y="322">Receive updated shared state</text>
<text x="924" y="354">Display crew + destinations</text>
<text x="84" y="578">Known spike positions establish a common local coordinate frame.</text>
<text x="84" y="610">Each headset relates shared positions to its own position and view.</text>
<text x="924" y="578">Depth sensing + LiDAR</text>
<text x="924" y="610">Local terrain + obstacle cues</text>
</g>
