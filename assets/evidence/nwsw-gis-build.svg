<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">A delivered GIS workflow with a path to rebuild it.</title><desc id="desc">Selected results from the recorded local rebuild and portability checks. Local checks establish rebuild behavior and portability. Independent recipient reproduction remains separate.</desc>
<rect width="1400" height="900" fill="#0b151b"/><path d="M60 55H1340" stroke="#72d7c9" stroke-width="3"/>
<text xml:space="preserve" x="60" y="105" fill="#72d7c9" font-family="Arial, sans-serif" font-size="20" font-weight="700">COMPLETED WORK / REPRODUCIBLE GIS</text><text xml:space="preserve" x="60" y="175" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="46" font-weight="700">A delivered GIS workflow with a path to rebuild it.</text>
<text xml:space="preserve" x="60" y="225" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="25" font-weight="400">Selected results from the recorded local rebuild and portability checks.</text><rect x="60" y="310" width="408" height="340" rx="16" fill="#13252e" stroke="#36515b"/><text xml:space="preserve" x="85" y="360" fill="#72d7c9" font-family="Arial, sans-serif" font-size="21" font-weight="700">01 / BUILD</text><text xml:space="preserve" x="85" y="425" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="30" font-weight="700">9 stages passed</text><text xml:space="preserve" x="85" y="480" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="24" font-weight="400">Recreated 16 linked</text><text xml:space="preserve" x="85" y="518" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="24" font-weight="400">geographic layers from</text><text xml:space="preserve" x="85" y="556" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="24" font-weight="400">preserved inputs.</text><rect x="494" y="310" width="408" height="340" rx="16" fill="#13252e" stroke="#36515b"/><text xml:space="preserve" x="519" y="360" fill="#72d7c9" font-family="Arial, sans-serif" font-size="21" font-weight="700">02 / CHECK</text><text xml:space="preserve" x="519" y="425" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="30" font-weight="700">Outputs verified</text><text xml:space="preserve" x="519" y="480" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="24" font-weight="400">Checked attributes, IDs,</text><text xml:space="preserve" x="519" y="518" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="24" font-weight="400">coordinate systems,</text><text xml:space="preserve" x="519" y="556" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="24" font-weight="400">geometry, and fresh</text><text xml:space="preserve" x="519" y="594" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="24" font-weight="400">exports.</text><rect x="928" y="310" width="408" height="340" rx="16" fill="#13252e" stroke="#36515b"/><text xml:space="preserve" x="953" y="360" fill="#72d7c9" font-family="Arial, sans-serif" font-size="21" font-weight="700">03 / REOPEN</text><text xml:space="preserve" x="953" y="425" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="30" font-weight="700">Portable project</text><text xml:space="preserve" x="953" y="480" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="24" font-weight="400">Reopened from a different</text><text xml:space="preserve" x="953" y="518" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="24" font-weight="400">folder in a fresh process.</text><text xml:space="preserve" x="60" y="735" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="25" font-weight="400">Completed local rebuild · ArcGIS Pro 3.7.3 · October 18, 2026</text>
<path d="M60 794H1340" stroke="#36515b"/><text xml:space="preserve" x="60" y="837" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="21" font-weight="400">Local checks establish rebuild behavior and portability. Independent recipient reproduction remains separate.</text></svg>