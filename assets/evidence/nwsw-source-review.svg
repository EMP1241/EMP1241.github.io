<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Check what a record means before mapping it.</title><desc id="desc">I reconciled source records while preserving their original values and unresolved differences. Selected results from the October 11 reconciliation record. Completed checks do not establish field accuracy.</desc>
<rect width="1400" height="900" fill="#0b151b"/><path d="M60 55H1340" stroke="#72d7c9" stroke-width="3"/>
<text xml:space="preserve" x="60" y="105" fill="#72d7c9" font-family="Arial, sans-serif" font-size="20" font-weight="700">COMPLETED WORK / SOURCE RECONCILIATION</text><text xml:space="preserve" x="60" y="175" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="46" font-weight="700">Check what a record means before mapping it.</text>
<text xml:space="preserve" x="60" y="225" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="25" font-weight="400">I reconciled source records while preserving their original values and unresolved</text><text xml:space="preserve" x="60" y="263" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="25" font-weight="400">differences.</text><text xml:space="preserve" x="60" y="325" fill="#72d7c9" font-family="Arial, sans-serif" font-size="36" font-weight="700">31,172 source rows checked</text><text xml:space="preserve" x="800" y="325" fill="#72d7c9" font-family="Arial, sans-serif" font-size="36" font-weight="700">124 retained inputs</text><rect x="60" y="365" width="1280" height="82" rx="10" fill="#13252e"/><text xml:space="preserve" x="85" y="400" fill="#72d7c9" font-family="Arial, sans-serif" font-size="25" font-weight="700">Dates</text><text xml:space="preserve" x="85" y="431" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="23" font-weight="400">Retain the distinction between an event date and a publication date.</text><rect x="60" y="460" width="1280" height="82" rx="10" fill="#13252e"/><text xml:space="preserve" x="85" y="495" fill="#72d7c9" font-family="Arial, sans-serif" font-size="25" font-weight="700">Reporting units</text><text xml:space="preserve" x="85" y="526" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="23" font-weight="400">Keep different source units visible instead of treating them as equivalent.</text><rect x="60" y="555" width="1280" height="82" rx="10" fill="#13252e"/><text xml:space="preserve" x="85" y="590" fill="#72d7c9" font-family="Arial, sans-serif" font-size="25" font-weight="700">Repeated publications</text><text xml:space="preserve" x="85" y="621" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="23" font-weight="400">Check whether several reports describe the same underlying record.</text><rect x="60" y="650" width="1280" height="82" rx="10" fill="#13252e"/><text xml:space="preserve" x="85" y="685" fill="#72d7c9" font-family="Arial, sans-serif" font-size="25" font-weight="700">Location precision</text><text xml:space="preserve" x="85" y="716" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="23" font-weight="400">Preserve approximate geography and unresolved source conflicts.</text>
<path d="M60 794H1340" stroke="#36515b"/><text xml:space="preserve" x="60" y="837" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="21" font-weight="400">Selected results from the October 11 reconciliation record. Completed checks do not establish field accuracy.</text></svg>