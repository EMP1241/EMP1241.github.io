<text xml:space="preserve" x="60" y="105" fill="#72d7c9" font-family="Arial, sans-serif" font-size="20" font-weight="700">02 / RUN · CAPTURED COMMAND OUTPUT</text><text xml:space="preserve" x="60" y="175" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="46" font-weight="700">Two files. One integrity check.</text>
<text xml:space="preserve" x="60" y="225" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="25" font-weight="400">The intact public sample was run to produce the output shown below.</text><rect x="60" y="290" width="1280" height="250" rx="16" fill="#13252e"/><text xml:space="preserve" x="90" y="345" fill="#72d7c9" font-family="Consolas, monospace" font-size="30" font-weight="700">$ python verify.py</text><text xml:space="preserve" x="90" y="405" fill="#f1f4ef" font-family="Consolas, monospace" font-size="24" font-weight="400">MATCH: both sample files match the supplied manifest</text><text xml:space="preserve" x="60" y="610" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="32" font-weight="700">Run the downloaded example locally.</text><text xml:space="preserve" x="60" y="665" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="26" font-weight="400">Python 3.10 or newer. No additional packages. The sample contains two synthetic files and</text><text xml:space="preserve" x="60" y="703" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="26" font-weight="400">their expected fingerprints.</text>
<path d="M60 794H1340" stroke="#36515b"/><text xml:space="preserve" x="60" y="837" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="21" font-weight="400">Actual output from the published synthetic example, typeset for readability.</text></svg>