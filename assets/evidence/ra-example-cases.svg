<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">The sample files and five cases being tested</title>
<desc id="desc">Two synthetic notes and a manifest are tested unchanged, changed, missing, with an extra file, and with an invalid fingerprint. Each change is made in a temporary copy.</desc>
<rect width="1400" height="900" fill="#0b151b"/><path d="M60 55H1340" stroke="#72d7c9" stroke-width="3"/>
<text xml:space="preserve" x="60" y="105" fill="#72d7c9" font-family="Arial, sans-serif" font-size="20" font-weight="700">02 / EXAMPLES · THE ACTUAL TEST CASES</text>
<text xml:space="preserve" x="60" y="175" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="46" font-weight="700">Two notes. Five controlled examples.</text>
<text xml:space="preserve" x="60" y="225" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="25" font-weight="400">The manifest records the expected names and fingerprints of both files.</text>
<rect x="60" y="270" width="625" height="130" rx="14" fill="#13252e" stroke="#36515b"/>
<text xml:space="preserve" x="85" y="315" fill="#f1f4ef" font-family="Consolas, monospace" font-size="26" font-weight="700">sample/source-note.txt</text>
<text xml:space="preserve" x="85" y="354" fill="#b3c6cc" font-family="Consolas, monospace" font-size="24" font-weight="400">Source ID: example-source-01</text>
<text xml:space="preserve" x="85" y="382" fill="#72d7c9" font-family="Arial, sans-serif" font-size="20" font-weight="400">Synthetic text file</text>
<rect x="715" y="270" width="625" height="130" rx="14" fill="#13252e" stroke="#36515b"/>
<text xml:space="preserve" x="740" y="315" fill="#f1f4ef" font-family="Consolas, monospace" font-size="26" font-weight="700">sample/method-note.txt</text>
<text xml:space="preserve" x="740" y="354" fill="#b3c6cc" font-family="Consolas, monospace" font-size="24" font-weight="400">Method ID: example-method-01</text>
<text xml:space="preserve" x="740" y="382" fill="#72d7c9" font-family="Arial, sans-serif" font-size="20" font-weight="400">Synthetic text file</text>
<rect x="60" y="430" width="1280" height="54" rx="9" fill="#13252e"/>
<text xml:space="preserve" x="82" y="465" fill="#72d7c9" font-family="Arial, sans-serif" font-size="23" font-weight="700">UNCHANGED</text>
<text xml:space="preserve" x="332" y="465" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="25" font-weight="400">Keep both notes exactly as supplied.</text>
<rect x="60" y="495" width="1280" height="54" rx="9" fill="#13252e"/>
<text xml:space="preserve" x="82" y="530" fill="#72d7c9" font-family="Arial, sans-serif" font-size="23" font-weight="700">CHANGED</text>
<text xml:space="preserve" x="332" y="530" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="25" font-weight="400">Append one line to source-note.txt.</text>
<rect x="60" y="560" width="1280" height="54" rx="9" fill="#13252e"/>
<text xml:space="preserve" x="82" y="595" fill="#72d7c9" font-family="Arial, sans-serif" font-size="23" font-weight="700">MISSING</text>
<text xml:space="preserve" x="332" y="595" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="25" font-weight="400">Remove source-note.txt from the test copy.</text>
<rect x="60" y="625" width="1280" height="54" rx="9" fill="#13252e"/>
<text xml:space="preserve" x="82" y="660" fill="#72d7c9" font-family="Arial, sans-serif" font-size="23" font-weight="700">UNEXPECTED</text>
<text xml:space="preserve" x="332" y="660" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="25" font-weight="400">Add sample/extra.txt to the test copy.</text>
<rect x="60" y="690" width="1280" height="54" rx="9" fill="#13252e"/>
<text xml:space="preserve" x="82" y="725" fill="#72d7c9" font-family="Arial, sans-serif" font-size="23" font-weight="700">MALFORMED</text>
<text xml:space="preserve" x="332" y="725" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="25" font-weight="400">Replace an expected fingerprint with &quot;invalid&quot;.</text>
<path d="M60 794H1340" stroke="#36515b"/>
<text xml:space="preserve" x="60" y="837" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="21" font-weight="400">Changes stay in a temporary copy. The downloaded notes and manifest remain unchanged.</text>
</svg>
