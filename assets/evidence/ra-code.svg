<title id="title">Check whether the delivered file changed.</title><desc id="desc">This Python function compares a file’s SHA-256 fingerprint with the expected fingerprint. Standalone synthetic teaching example. The download includes this exact function and the full verifier.</desc>
<rect width="1400" height="900" fill="#0b151b"/><path d="M60 55H1340" stroke="#72d7c9" stroke-width="3"/>
<text xml:space="preserve" x="60" y="105" fill="#72d7c9" font-family="Arial, sans-serif" font-size="20" font-weight="700">01 / CODE · PUBLIC RUNNABLE EXAMPLE</text><text xml:space="preserve" x="60" y="175" fill="#f1f4ef" font-family="Arial, sans-serif" font-size="46" font-weight="700">Check whether the delivered file changed.</text>
<text xml:space="preserve" x="60" y="225" fill="#b3c6cc" font-family="Arial, sans-serif" font-size="25" font-weight="400">This Python function compares a file’s SHA-256 fingerprint with the expected fingerprint.</text><rect x="60" y="290" width="1280" height="438" rx="16" fill="#13252e"/><text xml:space="preserve" x="90" y="343" fill="#f1f4ef" font-family="Consolas, monospace" font-size="22" font-weight="400">def inspect_file(path: Path, expected_hash: str) -&gt; str:</text><text xml:space="preserve" x="90" y="375" fill="#f1f4ef" font-family="Consolas, monospace" font-size="22" font-weight="400">    if path.is_symlink():</text><text xml:space="preserve" x="90" y="407" fill="#f1f4ef" font-family="Consolas, monospace" font-size="22" font-weight="400">        return &quot;REJECTED LINK&quot;</text><text xml:space="preserve" x="90" y="439" fill="#f1f4ef" font-family="Consolas, monospace" font-size="22" font-weight="400">    if not path.is_file():</text><text xml:space="preserve" x="90" y="471" fill="#f1f4ef" font-family="Consolas, monospace" font-size="22" font-weight="400">        return &quot;MISSING&quot;</text><text xml:space="preserve" x="90" y="503" fill="#f1f4ef" font-family="Consolas, monospace" font-size="22" font-weight="400">    digest = sha256()</text><text xml:space="preserve" x="90" y="535" fill="#f1f4ef" font-family="Consolas, monospace" font-size="22" font-weight="400">    with path.open(&quot;rb&quot;) as stream:</text><text xml:space="preserve" x="90" y="567" fill="#f1f4ef" font-family="Consolas, monospace" font-size="22" font-weight="400">        for block in iter(lambda: stream.read(1024 * 1024), b&quot;&quot;):</text><text xml:space="preserve" x="90" y="599" fill="#f1f4ef" font-family="Consolas, monospace" font-size="22" font-weight="400">            digest.update(block)</text><text xml:space="preserve" x="90" y="631" fill="#f1f4ef" font-family="Consolas, monospace" font-size="22" font-weight="400">    return &quot;MATCH&quot; if digest.hexdigest() == expected_hash else &quot;CHANGED&quot;</text>
