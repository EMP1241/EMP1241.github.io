<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">NWSW research context restored for a new session</title>
<desc id="desc">Two inputs support a resumed research session. The selected saved checkpoint supplies decisions and open work. Source-linked context is retrieved in needed pages and checked using identity and hashes. The numbered pages are schematic, with no fixed page count. Original records remain retained. This illustrates explicit retrieval and restoration, not automatic synchronization or guaranteed AI recall.</desc>
<rect width="1280" height="800" fill="#0b151b"/>
<text x="60" y="62.4" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#e4a5ab">NWSW / RESEARCH CONTINUITY</text>
<text x="60" y="130.8" font-family="Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#f3f0e7">Keep the thread across sessions.</text>
<text x="60" y="178.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#c0ced3">Restore saved state. Retrieve the evidence the next task needs.</text>
