<text x="548" y="541.6" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#c0ced3">File checks and specified reproduction steps.</text>
<rect x="60" y="630" width="1160" height="120" rx="16" fill="#14252c" stroke="#3d5965" stroke-width="1.5"/>
