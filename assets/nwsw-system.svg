<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Research Architect generates the NWSW role kits</title>
<desc id="desc">Research Architect generates three project role kits: Hub, contributor Pods with individual AI Spokes, and Ingestor. Branch arrows indicate generation, not a sequence of review steps. The independently built Spatial Evidence Workbench is used alongside the coordination system; it is not a generated kit or an asserted automated integration.</desc>
<rect width="1280" height="800" fill="#0b151b"/>
<text x="60" y="62.4" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#e4a5ab">NWSW / SYSTEM ARCHITECTURE</text>
<text x="60" y="130.8" font-family="Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#f3f0e7">From framework to research roles.</text>
<text x="60" y="178.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#c0ced3">Branch arrows show which role kits the framework generates.</text>
<rect x="60" y="230" width="310" height="330" rx="16" fill="#14252c" stroke="#e4a5ab" stroke-width="1.5"/>
<text x="88" y="275.6" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#e4a5ab">REUSABLE FRAMEWORK</text>
<text x="88" y="351.2" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="700" fill="#f3f0e7">Research</text>
<text x="88" y="402.2" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="700" fill="#f3f0e7">Architect</text>
<text x="88" y="468.2" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#c0ced3">Roles, methods</text>
<text x="88" y="503.2" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#c0ced3">and review controls</text>
<polyline points="370,395 440,395" fill="none" stroke="#e4a5ab" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="440,275 440,515" fill="none" stroke="#e4a5ab" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="440,275 520,275" fill="none" stroke="#e4a5ab" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="520,275 508.0,269.0 508.0,281.0" fill="#e4a5ab"/>
<polyline points="440,395 520,395" fill="none" stroke="#e4a5ab" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
