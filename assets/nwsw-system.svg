<polyline points="440,515 520,515" fill="none" stroke="#e4a5ab" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="520,515 508.0,509.0 508.0,521.0" fill="#e4a5ab"/>
<text x="520" y="218.6" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#e4a5ab">GENERATED NWSW ROLE KITS</text>
<rect x="520" y="230" width="700" height="90" rx="16" fill="#14252c" stroke="#e4a5ab" stroke-width="1.5"/>
<text x="548" y="267.0" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#e4a5ab">Hub</text>
<text x="548" y="301.6" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#c0ced3">Assignments, research review and final acceptance.</text>
