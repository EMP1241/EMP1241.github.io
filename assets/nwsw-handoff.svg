<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800"><rect width="1280" height="800" fill="#0b151b"/><g font-family="Arial,sans-serif"><text x="70" y="75" fill="#e8aaa6" font-size="19" letter-spacing="3">NWSW / VERIFIED HANDOFFS</text><text x="70" y="140" fill="#fff8ef" font-size="43">Keep the intended files with the research</text><path d="M620 292h40M345 375v50M935 375v50M620 507h40" fill="none" stroke="#77a9b1" stroke-width="3" stroke-dasharray="7 8"/><rect x="70" y="210" width="550" height="165" rx="16" fill="#14252c" stroke="#456474"/><text x="95" y="253" fill="#9fd7dc" font-size="18">01</text><text x="95" y="294" fill="#f4eee5" font-size="28">Version the package</text><text x="95" y="330" fill="#b9c5cc" font-size="19">Manifest, source identity, contributor context</text><rect x="660" y="210" width="550" height="165" rx="16" fill="#14252c" stroke="#456474"/><text x="685" y="253" fill="#9fd7dc" font-size="18">02</text><text x="685" y="294" fill="#f4eee5" font-size="28">Check the received bytes</text><text x="685" y="330" fill="#b9c5cc" font-size="19">SHA-256 hashes and declared file sizes</text><rect x="70" y="425" width="550" height="165" rx="16" fill="#14252c" stroke="#456474"/><text x="95" y="468" fill="#9fd7dc" font-size="18">03</text><text x="95" y="509" fill="#f4eee5" font-size="28">Review the contribution</text><text x="95" y="545" fill="#b9c5cc" font-size="19">Methods, findings, gaps, human decisions</text><rect x="660" y="425" width="550" height="165" rx="16" fill="#14252c" stroke="#456474"/><text x="685" y="468" fill="#9fd7dc" font-size="18">04</text><text x="685" y="509" fill="#f4eee5" font-size="28">Release with context</text><text x="685" y="545" fill="#b9c5cc" font-size="19">Reviewed transfer and recorded receipt</text><text x="70" y="705" fill="#b9c5cc" font-size="20">File verification identifies the package; research review evaluates its use.</text><text x="70" y="747" fill="#7e969e" font-size="16">Brandon Santor · Research system architecture</text></g></svg>